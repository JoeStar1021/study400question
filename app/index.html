<title>IB 400 学习台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --sunk:#E8ECE8; --ink:#16211D; --muted:#5A6862; --faint:#7F8C86; --line:#D6DDD8;
  --accent:#0D6A56; --accent-ink:#FFFFFF; --accent-soft:#DDEEE8; --accent-line:#A9D3C6;
  --again:#B9402C; --again-soft:#F7E3DE; --hard:#A86F12; --hard-soft:#F6EBD6; --good:#2C7A47; --good-soft:#DFF0E4;
  --st-done:#2C7A47; --st-due:#C98A1A; --st-new:#E4E9E5; --st-new-line:#C9D1CC;
  --zh:#33443E; --focus:#1F66D1; --scrim:rgb(10 20 16 / .35);
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --serif:"Source Serif 4","Songti SC","Noto Serif CJK SC",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hdr:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1412; --panel:#151D1A; --sunk:#1B2521; --ink:#E3EAE6; --muted:#9AA9A2; --faint:#7C8B84; --line:#28332F;
  --accent:#4DB597; --accent-ink:#06231B; --accent-soft:#173129; --accent-line:#2B5D4E;
  --again:#E57A65; --again-soft:#3A1F1A; --hard:#DBA64A; --hard-soft:#35291A; --good:#62BD80; --good-soft:#18301F;
  --st-done:#46A56A; --st-due:#B8801C; --st-new:#222D29; --st-new-line:#34413C;
  --zh:#C4D2CC; --focus:#6FA4F2; --scrim:rgb(0 0 0 / .55);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --panel:#151D1A; --sunk:#1B2521; --ink:#E3EAE6; --muted:#9AA9A2; --faint:#7C8B84; --line:#28332F;
  --accent:#4DB597; --accent-ink:#06231B; --accent-soft:#173129; --accent-line:#2B5D4E;
  --again:#E57A65; --again-soft:#3A1F1A; --hard:#DBA64A; --hard-soft:#35291A; --good:#62BD80; --good-soft:#18301F;
  --st-done:#46A56A; --st-due:#B8801C; --st-new:#222D29; --st-new-line:#34413C;
  --zh:#C4D2CC; --focus:#6FA4F2; --scrim:rgb(0 0 0 / .55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:var(--hdr);flex-wrap:wrap}
.tree-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.tree-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line)}
.tree-btn svg{width:16px;height:16px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:600;white-space:nowrap}
.brand b{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:15px}
.nav{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:6px 11px;border-radius:6px;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.nav .count{font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--accent)}
.hdr-right{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stats{display:flex;gap:14px;color:var(--muted);font-size:12px}
.stats strong{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:13px}
.sync{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--good)}
.sync.busy i{background:var(--accent);animation:pulse 1s infinite}
.sync.warn{border-color:var(--hard);color:var(--hard)} .sync.warn i{background:var(--hard)}
@keyframes pulse{50%{opacity:.3}}
.banner{background:var(--hard-soft);color:var(--ink);border-bottom:1px solid var(--line);padding:8px 16px;font-size:12.5px}

/* Layout */
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 390px;align-items:start}
.app.no-tree{grid-template-columns:minmax(0,1fr) 390px}
.app.no-aside{grid-template-columns:300px minmax(0,1fr)}
.app.no-tree.no-aside{grid-template-columns:minmax(0,1fr)}
.app.no-tree .tree{display:none}
.app.no-aside .aside{display:none}
.tree{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100vh - var(--hdr));overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding-block:8px 40px}
.main{padding:26px 40px 80px;min-width:0}
.aside{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100vh - var(--hdr));border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:29}
.tree-top{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 8px}
.tree-top span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tree-top button{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:5px}
.tree-top button:hover{background:var(--sunk)}

/* Tree */
.part{padding-inline:10px;margin-bottom:12px}
.part-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 8px 4px;font-size:12px;color:var(--muted);font-weight:600;border-top:1px solid var(--line);margin-top:4px}
.part:first-child .part-h{border-top:0;margin-top:0}
.part-h .mono{font-weight:400;letter-spacing:0}
.sec-btn{width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.sec-btn:hover{background:var(--sunk)}
.sec.open>.sec-btn{background:var(--accent-soft)}
.sec-t{font-weight:500;font-size:13px;line-height:1.3}
.sec-n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tag{font-size:10.5px;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:0 5px}
.bar{grid-column:1/-1;height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;display:flex;gap:1px}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)}.bar .h{background:var(--hard)}.bar .a{background:var(--again)}
.qlist{list-style:none;margin:4px 0 8px 14px;padding:0 0 0 8px;border-left:1px solid var(--line)}
.qlist button{width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:5px;display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted);line-height:1.4}
.qlist button:hover{background:var(--sunk);color:var(--ink)}
.qlist button[aria-current="true"]{background:var(--sunk);color:var(--ink);font-weight:500}
.qlist .qn{font-family:var(--mono);font-size:11px;min-width:24px;color:var(--faint)}
.qlist .qt{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qlist .nb{font-size:10px;color:var(--accent);font-family:var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--faint);flex:none;align-self:center}
.dot.again{background:var(--again);border-color:var(--again)}
.dot.hard{background:var(--hard);border-color:var(--hard)}
.dot.good{background:var(--good);border-color:var(--good)}
.dot.due{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--st-due)}

/* Study */
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb .pg{font-family:var(--mono);color:var(--faint)}
.sec-title{font-size:24px;line-height:1.25;margin:6px 0 4px;font-weight:600;text-wrap:balance}
.sec-sub{color:var(--muted);margin:0 0 12px;max-width:72ch}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 12px;font-size:12.5px;color:var(--ink)}
.ghost:hover{border-color:var(--faint)}
.ghost.danger{color:var(--again)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:7px 16px;font-weight:600;font-size:13px}
.primary:disabled,.ghost:disabled{opacity:.5;cursor:default}
details.intro{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:18px}
details.intro summary{cursor:pointer;font-weight:500;font-size:13px;color:var(--muted)}
details.intro[open] summary{margin-bottom:10px}
.review-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--hard-soft);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:16px;font-size:13px}
.review-bar .ghost{margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 28px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.qhead .qnum{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:13px}
.qhead .status{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.again{background:var(--again-soft);border-color:transparent;color:var(--again)}
.chip.hard{background:var(--hard-soft);border-color:transparent;color:var(--hard)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.qtext{font-family:var(--serif);font-size:19px;line-height:1.5;margin:0;font-weight:600;max-width:70ch}
.qtext.zh{font-family:var(--sans);color:var(--zh);font-size:16px;font-weight:500;margin-top:8px}
.reading{font-family:var(--serif);font-size:16px;line-height:1.65}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-block:6px;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.blk{margin:0;max-width:68ch}
.blk.zh{font-family:var(--sans);font-size:14.5px;line-height:1.75;color:var(--zh)}
.blk.li{padding-left:18px;position:relative}
.blk.li::before{content:"";position:absolute;left:4px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.blk.li.l2{margin-left:18px}
.stack{display:flex;flex-direction:column;gap:10px}
figure.fig{margin:14px 0;padding:12px;background:var(--sunk);border-radius:10px;display:flex;flex-direction:column;gap:10px;grid-column:1/-1}
figure.fig img{background:#fff;border-radius:6px;display:block;max-width:100%;height:auto;margin:0 auto}
figure.fig figcaption{font-size:13px;line-height:1.65;color:var(--ink)}
.fig-l{font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.answer{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.h3{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
.selftest{margin-top:20px;padding:16px 18px;background:var(--sunk);border-radius:10px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.checks label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.checks .inp{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding-inline:8px}
.checks .inp span{color:var(--faint);font-family:var(--mono)}
.checks input{border:0;background:none;padding:6px 4px;width:100%;font-family:var(--mono);outline:none}
.checks .res{font-family:var(--mono);font-size:12px}
.ok{color:var(--good)}.bad{color:var(--again)}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.insight{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.insight>div{border-radius:10px;padding:12px 14px;font-size:13.5px}
.insight .keys{background:var(--accent-soft)}
.insight .trap{background:var(--again-soft)}
.insight ul{margin:0;padding-left:18px}
.je{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.je-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.je-h .grow{flex:1}
.rate{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.rate button small{font-weight:400;color:var(--muted);font-size:11px;font-family:var(--mono)}
.rate .again:hover,.rate .again.on{border-color:var(--again);background:var(--again-soft);color:var(--again)}
.rate .hard:hover,.rate .hard.on{border-color:var(--hard);background:var(--hard-soft);color:var(--hard)}
.rate .good:hover,.rate .good.on{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.mynotes{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.mynotes .list{display:flex;flex-direction:column;gap:8px}
.pager{display:flex;justify-content:space-between;margin-top:14px;gap:10px}
.empty{color:var(--muted);text-align:center;padding:40px 16px}
.hint{font-size:11.5px;color:var(--faint)}

/* Aside */
.tabs{display:flex;border-bottom:1px solid var(--line);padding-inline:12px;gap:4px;flex:none}
.tabs button{border:0;background:none;padding:12px 10px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .ctx{margin-left:auto;align-self:center;font-size:11px;color:var(--faint);font-family:var(--mono)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.composer{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px;flex:none;background:var(--panel)}
.composer textarea{width:100%;min-height:74px;max-height:220px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);line-height:1.5}
.composer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.composer .row .grow{flex:1}
.endbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:12px}
.endbar span{flex:1;color:var(--muted);min-width:120px}
.note{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.note .meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--faint);margin-bottom:4px;flex-wrap:wrap}
.note .meta .sp{margin-left:auto;display:flex;gap:4px}
.note .meta button{border:0;background:none;color:var(--muted);font-size:11px;padding:2px 4px;border-radius:4px}
.note .meta button:hover{background:var(--sunk);color:var(--ink)}
.note .meta button.danger{color:var(--again)}
.note textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.md{font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}
.md p{margin:0 0 6px}.md p:last-child{margin:0}
.md ul,.md ol{margin:2px 0 6px;padding-left:20px}
.md code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:0 4px;border-radius:3px}
.md h4{margin:8px 0 4px;font-size:13px}
.md blockquote{margin:0 0 6px;padding-left:10px;border-left:3px solid var(--accent-line);color:var(--muted)}
.md .tw{overflow-x:auto;margin:6px 0}
.md table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md th{background:var(--sunk);font-weight:600}
.md td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.msg{max-width:92%;border-radius:12px;padding:8px 12px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.assistant{align-self:flex-start;background:var(--sunk)}
.msg .who{font-size:10.5px;opacity:.7;margin-bottom:2px;font-family:var(--mono)}
.msg.err{background:var(--again-soft);color:var(--again)}

/* Selection popover */
.sel-btn{position:fixed;z-index:40;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgb(0 0 0 / .2)}
.pop{position:fixed;z-index:41;width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgb(0 0 0 / .18);padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-height:60vh}
.pop .src{font-family:var(--serif);font-size:13px;color:var(--muted);border-left:3px solid var(--accent-line);padding-left:8px;max-height:4.8em;overflow:hidden}
.pop .body{overflow:auto}
.pop .row{display:flex;gap:8px;justify-content:flex-end}

/* Other views */
.view-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.view-h h2{margin:0;font-size:22px}
.view-h p{margin:0;color:var(--muted);max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:500}
.tile .l{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table.rev{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
table.rev th,table.rev td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
table.rev th{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--sunk)}
table.rev td.n{font-family:var(--mono);text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 8px;font-size:13px}
.filters input[type=search]{min-width:180px;flex:1;max-width:320px}
.nb-sec{margin-bottom:22px}
.nb-sec h3{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nb-sec h3 small{color:var(--faint);font-weight:400}
.nb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.qlink{border:0;background:none;padding:0;color:var(--accent);font-size:11px;text-align:left}
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.story{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.story h3{margin:0;font-size:14px}
.story .guide{font-size:12px;color:var(--muted);margin:0}
.story textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);line-height:1.55;resize:vertical}
.story .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.story .row .hint{margin-right:auto}
.story .fb{border-top:1px dashed var(--line);padding-top:8px}
.section-h{font-size:15px;margin:28px 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.section-h small{color:var(--faint);font-weight:400;font-size:12px}
.data-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-top:28px}
.data-box .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Progress map */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:18px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.cell{width:16px;height:16px;border-radius:4px;display:inline-block;position:relative;border:0;padding:0;flex:none}
.cell.new{background:var(--st-new);box-shadow:inset 0 0 0 1px var(--st-new-line)}
.cell.done{background:var(--st-done)}
.cell.due{background:var(--st-due)}
.cell.due::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--panel)}
button.cell:hover{outline:2px solid var(--ink);outline-offset:1px}
.map-part{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.map-part h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.map-part h3 small{font-family:var(--mono);color:var(--muted);font-weight:400}
.map-row{display:grid;grid-template-columns:minmax(160px,300px) 1fr auto;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.map-row:first-of-type{border-top:0}
.map-row .name{border:0;background:none;padding:0;text-align:left;font-size:13px;color:var(--ink);font-weight:500}
.map-row .name:hover{color:var(--accent);text-decoration:underline}
.map-cells{display:flex;flex-wrap:wrap;gap:3px}
.map-row .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right}
.tip{position:fixed;z-index:50;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:6px;max-width:300px;pointer-events:none;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:60;max-width:calc(100vw - 32px)}

@media (max-width:1240px){
  .app,.app.no-tree{grid-template-columns:minmax(0,1fr)}
  .app:not(.no-tree){grid-template-columns:280px minmax(0,1fr)}
  .aside{grid-column:-2/-1;position:static;height:auto;min-height:520px;margin:0 40px 40px;border:1px solid var(--line);border-radius:12px}
  .aside .scroll{max-height:60vh}
}
@media (max-width:900px){
  .app,.app:not(.no-tree),.app.no-aside{grid-template-columns:minmax(0,1fr)}
  .tree{position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);height:auto;z-index:30;box-shadow:0 0 40px rgb(0 0 0 / .25);padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .main{padding:18px 16px 40px}
  .aside{grid-column:1;margin:0 16px 32px}
  .card{padding:18px 16px}
  .pair{grid-template-columns:1fr;gap:4px}
  .insight{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .stats,.brand{display:none}
  .hdr{gap:8px;padding:6px 12px}
  .nav button{padding:5px 8px;font-size:13px}
  .map-row{grid-template-columns:1fr auto}
  .map-cells{grid-column:1/-1}
}
@media (min-width:901px){.scrim{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400000;
const TECH_PARTS = new Set(["tech", "industry"]);

/* ================= Local storage helpers ================= */
// Offline build: the book and figures are embedded in the file and all data lives in this browser.
const OFFLINE = !!window.IB400_OFFLINE;
const PFX = OFFLINE ? "ib400off:" : "ib400:";
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); return true; } catch { return false; } },
};

/* ================= State ================= */
const S = {
  parts: [], secs: {}, qs: {}, order: [],
  col: { progress: {}, notes: {}, je: {}, stories: {} }, chat: { key: null, turns: [] },
  view: "study", sid: null, qid: null, lang: "both", revealed: false, checked: null,
  openSecs: new Set(), review: null, noteKind: "note", tab: "notes", showTree: true,
  nbFilter: { part: "", src: "", status: "", q: "" }, editing: null, confirmDel: null,
};
let db = null, sample = null, downloads = null, connected = false;

/* ================= Text rendering ================= */
function inl(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(“"'>（])_(\S(?:.*?\S)?)_(?=[\s.,;:!?)”"'<，。；：）]|$)/g, "$1<em>$2</em>")
    .replace(/(^|[^*\w])\*(\S(?:[^*]*?\S)?)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(text) {
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  let out = "", list = null, para = [], tbl = null;
  const flushP = () => { if (para.length) { out += "<p>" + inl(para.join(" ")) + "</p>"; para = []; } };
  const closeL = () => { if (list) { out += `</${list}>`; list = null; } };
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const flushT = () => {
    if (!tbl) return;
    const rows = tbl.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
    const [h, ...b] = rows.map(cells);
    const td = c => `<td${/^[-+(（$¥€]?[\d,.]+[)）%]?$/.test(c.replace(/\s/g, "")) ? ' class="num"' : ""}>${inl(c)}</td>`;
    out += `<div class="tw"><table><thead><tr>${h.map(c => `<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${b.map(r => `<tr>${r.map(td).join("")}</tr>`).join("")}</tbody></table></div>`;
    tbl = null;
  };
  for (const raw of lines) {
    const l = raw.trimEnd(); let m;
    if (/^\s*\|.*\|\s*$/.test(l)) { flushP(); closeL(); (tbl ||= []).push(l); continue; } else flushT();
    if (!l.trim()) { flushP(); closeL(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flushP(); closeL(); out += "<h4>" + inl(m[1]) + "</h4>"; continue; }
    if ((m = l.match(/^>\s?(.*)/))) { flushP(); closeL(); out += "<blockquote>" + inl(m[1]) + "</blockquote>"; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (list !== "ul") { closeL(); out += "<ul>"; list = "ul"; } out += "<li>" + inl(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (list !== "ol") { closeL(); out += "<ol>"; list = "ol"; } out += "<li>" + inl(m[1]) + "</li>"; continue; }
    closeL(); para.push(l.trim());
  }
  flushT(); flushP(); closeL();
  return out;
}
const plain = s => String(s || "").replace(/\*\*|`/g, "").replace(/(^|\W)_(.+?)_(?=\W|$)/g, "$1$2").replace(/(^|[^*\w])\*([^*]+)\*/g, "$1$2");

/* ================= Content ================= */
async function loadBook() {
  let book = window.IB400_BOOK;
  if (!book) { const res = await fetch("content/book.json"); if (!res.ok) throw new Error("book " + res.status); book = await res.json(); }
  S.parts = book.parts;
  for (const p of S.parts) for (const s of p.sections) {
    s.pid = p.id; S.secs[s.id] = s;
    s.questions.forEach((q, i) => { q.sid = s.id; q.pid = p.id; q.i = i; S.qs[q.id] = q; S.order.push(q.id); });
  }
}
const qLabel = q => plain(q.zh?.q || q.q);
const allSecs = () => S.parts.flatMap(p => p.sections);

/* ================= Spaced repetition ================= */
const RATES = { again: "不会", hard: "模糊", good: "会" };
function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function nextSched(p, r, now = Date.now()) {
  let { ease = 2.5, ivl = 0, reps = 0, lapses = 0 } = p || {};
  if (r === "again") { reps = 0; lapses++; ivl = 0; ease = Math.max(1.3, ease - 0.2); }
  else if (r === "hard") { ivl = reps === 0 ? 1 : Math.max(ivl + 1, Math.round(ivl * 1.2)); ease = Math.max(1.3, ease - 0.15); reps++; }
  else { ivl = reps === 0 ? 1 : reps === 1 ? 3 : Math.max(ivl + 1, Math.round(ivl * ease)); reps++; }
  const due = ivl === 0 ? now + 10 * 60000 : startOfDay(now) + ivl * DAY;
  return { rating: r, ease: +ease.toFixed(2), ivl, reps, lapses, due, last: now };
}
function ivlLabel(p, r) { const n = nextSched(p, r); return n.ivl === 0 ? "10 分钟" : n.ivl + " 天"; }
const P = id => S.col.progress[id];
const isDue = p => !!p && p.due < startOfDay(Date.now()) + DAY;
const dueList = () => S.order.filter(id => isDue(P(id))).sort((a, b) => P(a).due - P(b).due);
const mapState = id => { const p = P(id); return !p ? "new" : isDue(p) ? "due" : "done"; };

/* ================= Persistence: outbox + cloud =================
   Every change is written to a local outbox first, then pushed to the
   cloud database. An entry leaves the outbox only after the cloud confirms
   it, so nothing is lost if the network or page drops mid-write. */
let outbox = store.get("outbox", []);
let flushing = false, flushTimer = null, lastSync = store.get("lastSync", 0), lastErr = null;
const COLS = ["progress", "notes", "je", "stories"];
function applyLocal(path, data) {
  const [c, id] = path.split("/");
  if (!S.col[c]) return;
  const m = { ...S.col[c] };
  if (data === null) delete m[id]; else m[id] = data;
  S.col[c] = m;
}
function persist(path, data) {
  if (OFFLINE) {
    applyLocal(path, data);
    if (!cacheLocal()) toast("浏览器存储空间不足，请先导出学习记录");
    store.set("dirty", store.get("dirty", 0) + 1);
    renderSync(); refresh(path.split("/")[0]);
    return;
  }
  outbox = outbox.filter(o => o.k !== path);
  outbox.push({ k: path, d: data, t: Date.now() });
  if (!store.set("outbox", outbox)) lastErr = "local";
  applyLocal(path, data);
  cacheLocal();
  renderSync();
  refresh(path.split("/")[0]);
  flush();
}
async function flush() {
  if (!db || flushing || !outbox.length) { renderSync(); return; }
  flushing = true; renderSync();
  while (outbox.length) {
    const o = outbox[0];
    try {
      const ref = db.doc(o.k);
      if (o.d === null) await ref.delete(); else await ref.set(o.d);
      outbox = outbox.filter(x => x !== o); store.set("outbox", outbox);
      lastSync = Date.now(); store.set("lastSync", lastSync); lastErr = null;
    } catch (e) {
      lastErr = e?.code || "unavailable";
      if (e?.code === "invalid_argument") { outbox = outbox.filter(x => x !== o); store.set("outbox", outbox); toast("有一条数据格式有误，已跳过"); continue; }
      break;
    }
  }
  flushing = false; renderSync();
  clearTimeout(flushTimer);
  if (outbox.length) flushTimer = setTimeout(flush, 20000);
}
window.addEventListener("online", () => flush());
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (S.qs[h] && h !== S.qid) openQuestion(h); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") flush(); });
function cacheLocal() { return store.set("cache", { progress: S.col.progress, notes: S.col.notes, je: S.col.je, stories: S.col.stories }); }
function overlayOutbox(c) { for (const o of outbox) if (o.k.startsWith(c + "/")) applyLocal(o.k, o.d); }
function subscribe() {
  for (const c of ["progress", "notes", "je", "stories"]) {
    db.collection(c).limit(1000).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
      S.col[c] = m; overlayOutbox(c); connected = true; cacheLocal(); renderSync(); refresh(c);
      if (c === "notes" && snap.size >= 1000) setBanner("笔记已超过 1000 条，请导出备份后联系 Claude 扩容。");
    }, onDbErr);
  }
}
let chatUnsub = null;
function chatKey() { return S.qid || (S.sid ? "sec-" + S.sid : null); }
function bindChat() {
  const key = chatKey();
  if (S.chat.key === key) return;
  chatUnsub?.(); chatUnsub = null;
  const cached = store.get("chat:" + key, null);
  S.chat = { key, turns: cached?.turns || [] };
  renderChat();
  if (!db || !key) return;
  chatUnsub = db.doc("chats/" + key).onSnapshot(d => {
    if (S.chat.key !== key || chatBusy) return;
    S.chat.turns = d.exists ? (d.data().turns || []) : []; store.set("chat:" + key, { turns: S.chat.turns }); renderChat();
  }, onDbErr);
}
function onDbErr(e) { if (e?.code !== "revoked") setBanner("云端连接中断。你的修改已保存在本机，恢复连接后会自动上传；也可以刷新页面重连。"); }
function renderSync() {
  const el = $("#sync"), n = outbox.length;
  el.className = "sync";
  if (OFFLINE) {
    const dirty = store.get("dirty", 0);
    el.classList.add(dirty ? "warn" : "ok");
    el.querySelector("span").textContent = dirty ? `离线 · ${dirty} 处修改未导出` : "离线 · 已全部导出";
    el.title = "离线版的数据只保存在这台电脑的浏览器里。点击导出学习记录，发给 Claude 合并到在线版。";
    return;
  }
  let t;
  if (!db) { t = n ? `${n} 条待上传（未连接）` : "本地模式"; if (n) el.classList.add("warn"); }
  else if (flushing) { t = "保存中…"; el.classList.add("busy"); }
  else if (n) { t = `${n} 条待上传`; el.classList.add("warn"); }
  else if (connected) { t = "已同步"; el.classList.add("ok"); }
  else t = "连接中…";
  el.querySelector("span").textContent = t;
  el.title = n ? "有修改尚未上传到云端，已安全保存在本机。点击立即重试。" : lastSync ? "最近一次上传：" + new Date(lastSync).toLocaleString() : "数据同步状态";
}
$("#sync").onclick = () => { if (OFFLINE) { exportJson(); return; } if (outbox.length) { flush(); toast(db ? "正在重试上传…" : "暂未连接云端，数据已保存在本机"); } else toast(connected ? "所有数据都已同步到云端" : "正在连接云端…"); };

/* ================= Refresh orchestration ================= */
function refresh(kind) {
  renderStats();
  if (kind === "progress") { renderTree(); if (onCard()) renderCard(true); if (S.view === "review" && !S.review) renderReview(); if (S.view === "map") renderMap(); }
  if (kind === "notes") { renderTree(); renderNotes(); if (onCard()) renderMyNotes(); if (S.view === "notebook") renderNotebook(); if (S.view === "stories") renderStories(); }
  if (kind === "je" && onCard()) renderJE();
  if (kind === "stories" && S.view === "stories") renderStories();
}
const onCard = () => (S.view === "study" || (S.view === "review" && S.review)) && S.qid;

/* ================= Header ================= */
function renderStats() {
  const vals = Object.values(S.col.progress), due = dueList().length;
  $("#stats").innerHTML = `<span>已学 <strong>${vals.length}</strong>/${S.order.length}</span><span>待复习 <strong>${due}</strong></span><span>笔记 <strong>${notesArr().length}</strong></span>`;
  $("#dueCount").textContent = due || "";
}
function setBanner(msg) { const b = $("#banner"); b.textContent = msg || ""; b.hidden = !msg; }

/* ================= Tree ================= */
const isNarrow = () => window.matchMedia("(max-width:900px)").matches;
function setTree(show, remember = true) {
  S.showTree = show;
  $("#app").classList.toggle("no-tree", !show);
  $("#scrim").hidden = !(show && isNarrow());
  $("#treeBtn").setAttribute("aria-pressed", show);
  $("#treeBtnL").textContent = show ? "隐藏目录" : "显示目录";
  if (remember && !isNarrow()) store.set("tree", show);
}
$("#treeBtn").onclick = () => setTree(!S.showTree);
$("#treeClose").onclick = () => setTree(false);
$("#scrim").onclick = () => setTree(false, false);
window.matchMedia("(max-width:900px)").addEventListener("change", e => setTree(e.matches ? false : store.get("tree", true), false));

function renderTree() {
  const el = $("#treeBody"), top = $("#tree").scrollTop;
  const nCount = {}; notesArr().forEach(n => { if (n.qid) nCount[n.qid] = (nCount[n.qid] || 0) + 1; });
  let h = "";
  for (const p of S.parts) {
    const pq = p.sections.flatMap(s => s.questions.map(q => q.id));
    const done = pq.filter(id => P(id)).length;
    h += `<div class="part"><div class="part-h"><span>${esc(p.title)}</span>${pq.length ? `<span class="mono">${done}/${pq.length}</span>` : ""}</div>`;
    for (const s of p.sections) {
      const n = s.questions.length, c = { good: 0, hard: 0, again: 0 };
      s.questions.forEach(q => { const r = P(q.id)?.rating; if (r) c[r]++; });
      const open = S.openSecs.has(s.id), learned = c.good + c.hard + c.again;
      h += `<div class="sec${open || (S.sid === s.id && !n) ? " open" : ""}"><button class="sec-btn" data-sec="${s.id}" aria-expanded="${open}">
        <span class="sec-t">${esc(s.title)}</span>${n ? `<span class="sec-n">${learned}/${n}</span>` : `<span class="tag">导读</span>`}
        ${n ? `<span class="bar" aria-hidden="true"><i class="g" style="width:${c.good / n * 100}%"></i><i class="h" style="width:${c.hard / n * 100}%"></i><i class="a" style="width:${c.again / n * 100}%"></i></span>` : ""}
      </button>`;
      if (open && n) {
        h += `<ul class="qlist">`;
        for (const q of s.questions) {
          const pr = P(q.id);

function blockHTML(b, txt, cls) { return `<p class="blk ${b.t === "li" ? "li" + (b.lvl === 2 ? " l2" : "") : ""} ${cls}">${inl(txt)}</p>`; }
function figHTML(f) { return `<figure class="fig"><img src="${esc(window.IB400_FIGS?.[f.src] || "content/" + f.src)}" alt="${esc(plain(f.captionZh).slice(0, 120))}" loading="lazy"><figcaption><div class="fig-l">原书插图 · 中文说明</div>${md(f.captionZh)}</figcaption></figure>`; }
function blocksHTML(en, zh, figs, lang) {
  const at = {}; (figs || []).forEach(f => { (at[f.after] ||= []).push(f); });
  const figsAt = i => (at[i] || []).map(figHTML).join("");
  let h = figsAt(0);
  if (lang === "en" || !zh) { h += en.map((b, i) => `<div class="stack reading">${blockHTML(b, b.md, "")}</div>` + figsAt(i + 1)).join(""); return `<div class="stack">${h}</div>`; }
  if (lang === "zh") { h += en.map((b, i) => blockHTML(b, zh[i], "zh") + figsAt(i + 1)).join(""); return `<div class="stack">${h}</div>`; }
  h += en.map((b, i) => `<div class="pair reading">${blockHTML(b, b.md, "")}${blockHTML(b, zh[i], "zh")}</div>` + figsAt(i + 1)).join("");
  return `<div>${h}</div>`;
}
function langSeg() { return `<div class="seg" role="group" aria-label="语言">${[["en", "EN"], ["zh", "中"], ["both", "对照"]].map(([k, l]) => `<button data-lang="${k}" aria-pressed="${S.lang === k}">${l}</button>`).join("")}</div>`; }
const fmtN = v => (v > 0 ? "+" : "") + (Number.isInteger(v) ? v : +v.toFixed(2));
const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };

function rules() {

${USER_BG}

function renderChat() {

  $("#chatSend").disabled = !avail || chatBusy || !S.chat.key; $("#chatStop").hidden = !chatBusy || !!chatPhase;

function saveChat() {
  const key = S.chat.key; if (!key) return;
  const turns = S.chat.turns.filter(m => !m.pending && !m.err).slice(-60).map(({ role, content }) => ({ role, content }));
  store.set("chat:" + key, { turns });
  if (!db) return;
  db.doc("chats/" + key).set({ turns, updated: Date.now() }).catch(() => {});
}
async function sendChat() {
  const box = $("#chatInput"), text = box.value.trim(); if (!text || !sample || chatBusy || !S.chat.key) return;
  box.value = "";
  const key = S.chat.key;
  S.chat.turns.push({ role: "user", content: text });
  const reply = { role: "assistant", content: "", pending: true };
  S.chat.turns.push(reply); chatBusy = true; renderChat();
  const hist = S.chat.turns.filter(m => !m.pending && !m.err).slice(-16).map(m => ({ role: m.role, content: m.content }));
  while (hist.length && hist[0].role !== "user") hist.shift();
  chatCtl = new AbortController();
  const bubble = () => $(`#chatList .msg[data-i="${S.chat.turns.indexOf(reply)}"] .md`);
  try {
    const { text: out, truncated } = await sample([{ role: "user", content: rules() }, ...hist], {
      cache: false, signal: chatCtl.signal,
      onText: ({ text: t }) => { if (S.chat.key !== key) return; reply.pending = false; reply.content = t; const b = bubble(); if (b) { b.innerHTML = md(t); $("#chatList").scrollTop = 1e9; } },
    });
    reply.pending = false; reply.content = out + (truncated ? "\n\n（回答过长被截断，可以让 Claude 继续）" : "");
  } catch (e) {
    reply.pending = false;
    if (e?.text) reply.content = e.text + "\n\n（已中断）";

  }

}
$("#chatSend").onclick = sendChat;
$("#chatStop").onclick = () => chatCtl?.abort();

async function summarizeChat() {
  if (!sample || chatBusy) return;
  const key = S.chat.key, ctx = { qid: S.qid, sid: S.sid };
  const s = S.secs[S.sid], q = S.qid ? S.qs[S.qid] : null;

  try {
    const { text } = await sample(`下面是我在学习《400 Questions Guide for Investment Banking Interviews》“${s.title}”${q ? `第 ${q.n} 题（${plain(q.q).slice(0, 120)}）` : "导读"}时与你的讨论。请整理成一条复习笔记：
- 简体中文，关键术语保留英文
- 3–8 条要点，用“- ”开头；保留关键的数字推演和结论；把我原来没懂、后来弄懂的点写清楚
- 只输出笔记正文，不要标题和客套话

讨论记录：
${transcript}`, { modelTier: "default", cache: false });
    addNote(text.trim(), "claude", ctx);
    if (S.chat.key === key) { S.chat.turns = []; saveChat(); }
    else { store.set("chat:" + key, { turns: [] }); if (db) db.doc("chats/" + key).set({ turns: [], updated: Date.now() }).catch(() => {}); }
    toast("已总结并存入笔记，讨论已清空");
    setTab("notes");
  } catch (e) { toast(sampleErr(e)); }
  chatBusy = false; chatPhase = ""; renderChat();
}
function sampleErr(e) {
  const c = e?.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared") return "本页未获准使用 Claude。刷新后在弹窗中允许即可。";
  if (c === "rate_limited") return "请求太频繁或已达到用量上限，请稍后再试。";
  if (c === "session_expired") return "登录已过期，请重新登录 claude.ai。";
  if (c === "prompt_too_large") return "内容太长，请先清除部分讨论。";
  if (c === "refused") return "Claude 没有回答这个请求，换个问法试试。";
  return "连接 Claude 失败，请稍后再试。";
}

    <div class="row">${canSave ? `<button class="${OFFLINE ? "primary" : "ghost"}" data-act="exportJson">${OFFLINE ? "导出学习记录（JSON）" : "导出完整备份（JSON）"}</button><button class="ghost" data-act="exportMd">导出笔记（Markdown）</button>` : `<span class="hint">在 claude.ai 中打开本页后可导出备份。</span>`}<button class="ghost" data-act="import">${OFFLINE ? "导入在线版备份" : "从备份导入"}</button></div><div id="importMsg"></div></div>`;
  $("#main").innerHTML = h;
  const bind = (id, key) => { const el = $("#" + id); el.oninput = el.onchange = () => { S.nbFilter[key] = el.value; if (id !== "fQ") renderNotebook(); else { clearTimeout(bind.t); bind.t = setTimeout(() => { renderNotebook(); const q = $("#fQ"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); } }; };
  bind("fPart", "part"); bind("fSrc", "src"); bind("fStatus", "status"); bind("fQ", "q");
}
async function saveFile(filename, data, type) {
  if (downloads) { await downloads.save({ filename, data }); return true; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
async function exportJson() {
  const stamp = new Date().toISOString().replace(/[:T]/g, "-").slice(0, 16);
  const data = { app: "ib400", version: 2, source: OFFLINE ? "offline" : "online", exported: new Date().toISOString(), progress: S.col.progress, notes: S.col.notes, stories: S.col.stories, je: S.col.je };
  try {
    await saveFile(`ib400-${OFFLINE ? "offline" : "backup"}-${stamp}.json`, JSON.stringify(data, null, 1), "application/json");
    if (OFFLINE) { store.set("dirty", 0); store.set("lastExport", Date.now()); renderSync(); if (S.view === "notebook") renderNotebook(); toast("已导出。把这个文件发给 Claude 即可合并到在线版"); }
  } catch (e) { if (e?.code && !/cancel|declin/.test(e.code)) toast("导出未完成"); }
}
async function exportNotes() {
  let out = `# IB 400 学习笔记\n\n导出时间：${new Date().toLocaleString()}\n`;
  const all = notesArr();
  for (const s of allSecs()) {
    const arr = all.filter(n => n.sid === s.id); if (!arr.length) continue;
    out += `\n## ${s.title}\n`;
    for (const n of arr) { const q = n.qid ? S.qs[n.qid] : null; out += `\n### ${q ? "Q" + q.n + " " + qLabel(q).slice(0, 80) : "本节"} · ${SRC[noteSrcKey(n)]}\n\n${n.text}\n`; }
  }
  const ideas = all.filter(n => !n.sid); if (ideas.length) { out += `\n## Story 灵感\n`; ideas.forEach(n => { out += `\n- ${n.text.replace(/\n/g, " ")}\n`; }); }
  try { await saveFile("ib400-notes.md", out, "text/markdown"); } catch (e) { if (e?.code && !/cancel|declin/.test(e.code)) toast("导出未完成"); }
}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files?.[0]; e.target.value = ""; if (!f) return;
  const msg = $("#importMsg");
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "ib400") throw 0;
    const cnt = { progress: Object.keys(d.progress || {}).length, notes: Object.keys(d.notes || {}).length };
    msg.innerHTML = `<div class="endbar" style="margin-top:8px"><span>文件含 ${cnt.progress} 条进度、${cnt.notes} 条笔记。导入是合并：新内容全部加入，同一条内容保留较晚修改的版本，不会删除任何现有数据。</span><button class="ghost" id="impNo">取消</button><button class="primary" id="impYes">确认导入</button></div>`;
    $("#impNo").onclick = () => { msg.innerHTML = ""; };
    $("#impYes").onclick = () => { const r = mergeData(d); msg.innerHTML = ""; toast(`已合并：新增 ${r.added} 条、更新 ${r.updated} 条、保留现有 ${r.kept} 条`); };
  } catch { msg.innerHTML = `<p class="hint bad">这个文件不是 IB 400 学习台的备份。</p>`; }
});

// Merge rule shared with Claude's server-side merge: never delete; per record keep the later edit.
const stampOf = (c, v) => c === "progress" ? v?.last || 0 : c === "notes" ? v?.updated || v?.created || 0 : c === "je" ? v?.ts || 0 : 0;
function mergeData(d) {
  const r = { added: 0, updated: 0, kept: 0 };
  for (const c of ["progress", "notes", "je"]) for (const [id, v] of Object.entries(d[c] || {})) {
    const cur = S.col[c][id];
    if (!cur) { persist(c + "/" + id, v); r.added++; }
    else if (stampOf(c, v) > stampOf(c, cur)) { persist(c + "/" + id, v); r.updated++; }
    else r.kept++;
  }
  const inc = d.stories?.core; if (inc) {
    const cur = { ...(S.col.stories.core || {}) }; let changed = false;
    for (const [k, v] of Object.entries(inc)) {
      if (!cur[k]) { cur[k] = v; changed = true; r.added++; }
      else if ((v?.updated || 0) > (cur[k].updated || 0)) { cur[k] = v; changed = true; r.updated++; }
      else r.kept++;
    }
    if (changed) persist("stories/core", cur);
  }
  return r;
}

/* ================= Story Bank ================= */
const SLOTS = [
  ["resume_outline", "简历介绍 · 四段提纲", "起点（家乡 / 学校）→ 金融“Spark”（让你对金融产生兴趣的具体人或事）→ 兴趣加深（技能和经历如何积累）→ 为什么今天在这里（为什么是这家机构、这个组）。"],
  ["resume_short", "简历介绍 · 短版", "100–150 词，对应“Walk me through your resume / Tell me about yourself”。书中认为这是最重要的一题，值得花 1–2 小时准备。"],
  ["resume_full", "简历介绍 · 完整版", "200–300 词，按四段提纲展开，结尾落到“为什么是你们”。"],
  ["success", "成功故事", "最好来自工作经历：你做了什么、结果如何、用了哪些与这份工作相关的能力。"],
  ["failure", "失败故事", "真实的失败：目标是什么、为什么没达成、你学到了什么、之后怎么改的。"],
  ["leadership", "领导力故事", "必须涉及与他人协作：协调、推动、解决冲突或突发问题。"],
  ["strengths", "3 个优点", "可以相对通用：定量分析、客户管理、长时间工作、注重细节、会计与金融知识等，每个配一个例子。"],
  ["weaknesses", "3 个缺点", "“真实但不致命”：不善于授权、决策偏慢、发现问题不总是说出来等。不要说“我太努力”，也不要说数学差或粗心。"],
  ["objections", "背景短板与回应", "对照面试官心中的“理想候选人”，列出你的短板，用“改善趋势”或“可迁移能力”回应。"],
  ["why_ib", "Why Banking / Why This Role", "书中认为唯一站得住的答案：想从头到尾完整参与交易，并积累大量交易经验。说清楚之前的经历缺了哪些环节。"],
];
const storyFb = {};
const storyDoc = () => S.col.stories.core || {};
function renderStories() {
  const ideas = notesArr().filter(n => n.kind === "idea"), sd = storyDoc();
  const drafts = {}; SLOTS.forEach(([k]) => { const el = $("#st-" + k); if (el && el.value !== (sd[k]?.text || "")) drafts[k] = el.value; });
  const ideaDraft = $("#ideaInput")?.value || "";
  let h = `<div class="view-h"><h2>Story Bank</h2><p>按书中 Fit 部分的框架，把你自己的经历整理成可以反复使用的回答。</p></div>
  <h3 class="section-h">灵感 <small>随手记下以后可能用得上的经历片段；在 Fit 小节的笔记里切换到“Story 灵感”也会存到这里</small></h3>
  <div class="story" style="margin-bottom:10px"><textarea id="ideaInput" style="min-height:64px" placeholder="例如：泰国项目退出时，和日本战略买家谈判的细节…"></textarea><div class="row"><span class="hint">保存后出现在下方列表</span><button class="primary" id="ideaSave">记下灵感</button></div></div>
  <div class="nb-grid">${ideas.map(n => noteCard(n, true)).join("") || '<p class="hint">还没有灵感。</p>'}</div>
  <h3 class="section-h">核心回答 <small>每一栏单独保存；可以请 Claude 按书中标准点评</small></h3><div class="story-grid">`;
  for (const [k, t, g] of SLOTS) {
    const fb = storyFb[k];
    h += `<div class="story" data-slot="${k}"><h3>${t}</h3><p class="guide">${esc(g)}</p><textarea id="st-${k}" placeholder="在这里写你的版本（中英文都可以）">${esc(sd[k]?.text || "")}</textarea>
      <div class="row"><span class="hint">${sd[k]?.updated ? "上次保存 " + fmtDate(sd[k].updated) : "未保存"}</span>${sample ? `<button class="ghost" data-sact="fb">请 Claude 点评</button>` : ""}<button class="primary" data-sact="save">保存</button></div>
      ${fb ? `<div class="fb md">${fb === "…" ? "Claude 正在阅读…" : md(fb)}</div>` : ""}</div>`;
  }
  $("#main").innerHTML = h + `</div>`;
  Object.entries(drafts).forEach(([k, v]) => { const el = $("#st-" + k); if (el) el.value = v; });
  $("#ideaInput").value = ideaDraft;
  $("#ideaSave").onclick = () => { const t = $("#ideaInput").value.trim(); if (!t) return; $("#ideaInput").value = ""; addNote(t, "me", { qid: null, sid: null, pid: "fit", kind: "idea" }); toast("灵感已保存"); };
}
$("#main").addEventListener("click", async e => {
  const b = e.target.closest("[data-sact]"); if (!b || S.view !== "stories") return;
  const k = b.closest("[data-slot]").dataset.slot, val = $("#st-" + k).value;
  if (b.dataset.sact === "save") { persist("stories/core", { ...storyDoc(), [k]: { text: val, updated: Date.now() } }); toast("已保存"); renderStories(); }
  if (b.dataset.sact === "fb") {
    if (!val.trim()) { toast("先写一点内容再请 Claude 点评"); return; }
    const slot = SLOTS.find(x => x[0] === k);
    storyFb[k] = "…"; renderStories();
    try {
      const { text } = await sample(`你是投行 / PE 面试教练。${USER_BG}
下面是用户为“${slot[1]}”准备的回答草稿。书中的要求：${slot[2]}
请用简体中文点评：1) 最强的一点；2) 最需要改的 2–3 点（具体到句子）；3) 如果适合，给一版改写后的英文（控制在书中建议的字数内）。简洁，不客套。

草稿：
${val}`, { modelTier: "default", cache: false });
      storyFb[k] = text;
    } catch (err) { storyFb[k] = sampleErr(err); }
    renderStories();
  }
});

/* ================= Toast ================= */
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }

/* ================= Boot ================= */
async function boot() {
  S.lang = store.get("lang", "both");
  S.openSecs = new Set(store.get("open", []));
  $("#noteInput").value = store.get("draft", "");
  setTree(isNarrow() ? false : store.get("tree", true), false);
  const cache = store.get("cache", null);
  if (cache) for (const c of COLS) S.col[c] = cache[c] || {};
  for (const c of COLS) overlayOutbox(c);
  renderSync();
  try { await loadBook(); }
  catch { $("#main").innerHTML = `<p class="empty">书本内容加载失败，请刷新页面重试。</p>`; return; }
  const hash = (location.hash || "").slice(1), last = store.get("last", "");
  const start = S.qs[hash] ? hash : S.qs[last] ? last : "accounting-calculations-1";
  renderStats(); renderChat();
  openQuestion(start, "study");

  if (OFFLINE) {
    $("#tabChat").hidden = true;
    setBanner("离线版：进度和笔记保存在这台电脑的浏览器里。在“笔记本”页底部导出学习记录，发给 Claude 即可合并到在线版。问 Claude、划词解释、生成会计分录需要在线版。");
    renderSync(); return;
  }
  const C = window.claude;
  if (!C?.use) { setBanner("本地预览：未连接 claude.ai。修改会先保存在本机，在 claude.ai 中打开后自动上传。"); renderSync(); return; }
  C.use("sample").then(s => { sample = s; renderChat(); if (onCard()) renderJE(); if (S.view === "stories") renderStories(); });
  C.use("downloads").then(d => { downloads = d; if (S.view === "notebook") renderNotebook(); });
  const d = await C.use("db");
  if (!d) { setBanner("暂时连不上云端数据库。你的修改会保存在本机，下次连接后自动上传。"); renderSync(); return; }
  db = d; subscribe(); flush();
  S.chat.key = null; bindChat();
}
boot();
})();
